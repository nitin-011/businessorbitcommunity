version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - NODE_ENV=production
      # - MONGO_URL=mongodb+srv://... (Define in AWS / production)
      # - JWT_SECRET=...
      # - CORS_ORIGINS=...
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://your-backend-domain.com
    restart: unless-stopped
