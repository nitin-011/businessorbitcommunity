version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      - PORT=8001
      - NODE_ENV=production
      # - MONGO_URL=mongodb+srv://... (Define in AWS / production)
      # - JWT_SECRET=...
      # - CORS_ORIGINS=...
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # - NEXT_PUBLIC_API_URL=http://your-backend-domain.com
    restart: unless-stopped
